# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override Redis URL to reach the redis service inside the compose network
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    volumes:
      # WhatsApp session — persists across container restarts and redeployments
      - whatsapp_session:/app/.wwebjs_auth
      # TikTok cookies — copy cookies.txt to the server next to docker-compose.yml
      # then run: docker compose up -d
      - ./cookies.txt:/app/cookies.txt:ro
    # Increase shared memory for Playwright Chrome (default 64 MB is too small)
    shm_size: '256mb'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  whatsapp_session:   # WhatsApp LocalAuth session files
  redis_data:         # BullMQ job queues
