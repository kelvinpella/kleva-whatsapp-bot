# Nixpacks configuration for Railway deployment
# Installs Chromium dependencies required by Puppeteer (used by whatsapp-web.js)

[phases.setup]
nixPkgs = ["nodejs_18", "chromium"]

[phases.install]
cmds = ["npm install"]

[start]
cmd = "npm start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
