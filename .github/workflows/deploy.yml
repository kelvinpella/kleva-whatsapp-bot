name: Deploy to Contabo

# Auto-deploy on every push to main. Also runnable manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight deploy if a newer commit is pushed.
concurrency:
  group: deploy-contabo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT }}
          # Fail the job if any deploy step fails.
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.CONTABO_APP_DIR }}"
            cd "$APP_DIR"
            echo "==> Pulling latest main"
            git fetch --all --prune
            git reset --hard origin/main
            echo "==> Rebuilding and restarting containers"
            docker compose up -d --build
            echo "==> Pruning dangling images"
            docker image prune -f
            echo "==> Deployed commit: $(git rev-parse --short HEAD)"
